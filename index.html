<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echidna Tea games</title>

    <style>
        body {
            background: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            padding: 20px 40px;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        p {
            margin: 5px 0 0 0;
            color: #ccc;
            font-size: 1rem;
        }

        /* Games button */
        .games-button {
            position: relative;
            margin-top: 70px;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #000;
            border: 3px solid #fff;
            color: #fff;
            font-size: 1.25rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s ease;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .games-button:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.35);
        }

        .games-button:active {
            transform: scale(0.96);
        }

        /* Directional arrows */
        .arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 13px solid white;
            opacity: 0.8;
        }

        .arrow.up {
            top: 15px;
            left: 67px;
        }

        .arrow.down {
            bottom: 15px;
            left: 67px;
            transform: rotate(180deg);
        }

        .arrow.left {
            left: 15px;
            top: 67px;
            transform: rotate(-90deg);
        }

        .arrow.right {
            right: 15px;
            top: 67px;
            transform: rotate(90deg);
        }
    </style>
</head>

<body>

    <div class="header-container">
        <h1>Echidna Games</h1>
        <p>Play and you get very good echidna tea</p>
    </div>

    <button class="games-button">
        <span class="arrow up"></span>
        <span class="arrow down"></span>
        <span class="arrow left"></span>
        <span class="arrow right"></span>

        Games
    </button>

</body>
</html>
