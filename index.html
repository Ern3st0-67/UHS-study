<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echidna Tea games</title>
    <style>
        body {
            /* Loads the Echidna Pinterest image */
            background-image: url('https://pinimg.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Text layout and styling */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .header-container {
            /* Translucent dark box makes "Echidna Tea games" highly readable over the art */
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            padding: 20px 40px;
            margin-top: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        p {
            margin: 5px 0 0 0;
            color: #ccc;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Echidna Tea games</h1>
        <p>e</p>
    </div>

</body>
</html>
