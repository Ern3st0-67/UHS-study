<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>

    <style>
        body {
            background: #000;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin: 20px 0 25px;
        }

        .search-container {
            display: flex;
            justify-content: center;
        }

        .search-bar {
            width: 500px;
            max-width: 80%;
            padding: 14px 20px;
            font-size: 1rem;
            color: white;
            background: #111;
            border: 2px solid white;
            border-radius: 25px;
            outline: none;
        }

        .search-bar::placeholder {
            color: #888;
        }

        .search-bar:focus {
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>

    <h1>Games</h1>

    <div class="search-container">
        <input
            type="text"
            class="search-bar"
            placeholder="Search games..."
        >
    </div>

</body>
</html>
